# ===============================
# ? SERVER CONFIG
# ===============================
server.port=8080

# ===============================
# ? MONGODB ATLAS CONFIG
# ===============================
# Replace username, password, cluster details
spring.data.mongodb.uri=mongodb+srv://cfuser:cfpassword@cluster0.xmmiqpc.mongodb.net/cftracker?appName=Cluster0

# ===============================
# ? LOGGING CONFIG
# ===============================
logging.level.org.springframework=INFO
logging.level.com.cftracker=DEBUG

# ===============================
# ? API TIMEOUT CONFIG
# ===============================
spring.mvc.async.request-timeout=5000

# ===============================
# ? CORS CONFIG (Basic)
# ===============================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE

# ===============================
# ? JACKSON (JSON) CONFIG
# ===============================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ===============================
# ?? SCHEDULER THREAD CONFIG
# ===============================
spring.task.scheduling.pool.size=2

# ===============================
# ? OPTIONAL (USE ENV VARIABLE INSTEAD - RECOMMENDED)
# ===============================
# Uncomment below and use environment variable instead of hardcoding
# spring.data.mongodb.uri=${MONGO_URI}